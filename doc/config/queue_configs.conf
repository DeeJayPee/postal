# Queue Configuration for Postal
# Format: <domain queue_name>
#           min-smtp-out <number>
#           max-smtp-out <number>
#           max-rcpt-per-message <number>
#           max-msg-rate <number>/<d|h|m|s>  # Optional: rate limit (e.g., 10000/d, 2000/h, 100/m, 10/s)
#           backoff-reroute-to <ip_address>  # Optional: IP to use for backoff/throttling
#         </domain>

# Hotmail/Outlook (from PowerMTA: max-smtp-out 20)
<domain hotmail.queue>
    max-smtp-out 20
</domain>

# Yahoo EU
<domain yahooeu.queue>
    min-smtp-out 1
    max-smtp-out 20
</domain>

# Yahoo (main)
<domain yahoo.queue>
    min-smtp-out 2
    max-smtp-out 20
</domain>

# Gmail
<domain gmail.queue>
    min-smtp-out 20
</domain>

# Proofpoint
<domain proofpoint.queue>
    min-smtp-out 1
    max-smtp-out 1
    max-rcpt-per-message 100
</domain>

# AOL
<domain aol.queue>
    max-smtp-out 10
    max-rcpt-per-message 100
</domain>

# Orange with rate limiting
<domain orange.queue>
    min-smtp-out 1
    max-smtp-out 32
    max-rcpt-per-message 100
    max-msg-rate 2000/h
</domain>

# Free with backoff IP
<domain free.queue>
    max-smtp-out 1
    backoff-reroute-to 192.168.1.100
</domain>

# SFR
<domain sfr.queue>
    min-smtp-out 1
    max-smtp-out 3
</domain>

# Bouygues
<domain bouygues.queue>
    min-smtp-out 1
    max-smtp-out 3
</domain>

# Numericable
<domain numericable.queue>
    min-smtp-out 1
    max-smtp-out 3
</domain>

# Rollup names (when MX rollups match, these rollup names are used as virtual queue names)

<domain proofpoint.rollup>
    min-smtp-out 1
    max-smtp-out 1
    max-rcpt-per-message 100
</domain>

<domain gmail-biz.rollup>
    min-smtp-out 20
</domain>

<domain gmail-forward.rollup>
    min-smtp-out 20
</domain>

<domain orange.rollup>
    min-smtp-out 1
    max-smtp-out 32
    max-rcpt-per-message 100
</domain>

<domain sfr-fr.rollup>
    min-smtp-out 1
    max-smtp-out 3
</domain>

<domain outlook-eur.rollup>
    max-smtp-out 20
</domain>

<domain outlook-apc.rollup>
    max-smtp-out 20
</domain>

<domain outlook-nam.rollup>
    max-smtp-out 20
</domain>

<domain yahoo.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>

<domain yahoo-aol.rollup>
    max-smtp-out 10
    max-rcpt-per-message 100
</domain>

<domain yahoo-eu.rollup>
    min-smtp-out 1
    max-smtp-out 20
</domain>

<domain yahoo-apac.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>

<domain yahoo-tw.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>

<domain yahoo-biz.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>

<domain yahoo-rogers.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>

<domain yahoo-japan.rollup>
    min-smtp-out 2
    max-smtp-out 20
</domain>
