# Domain Macro Configuration for Postal
# Format: domain-macro <name> <domain1>,<domain2>,...
#         queue-to <queue_name>

# Outlook/Hotmail domains
domain-macro hotmail hotmail.com,live.com,hotmail.fr,msn.fr,hotmail.co.uk,hotmail.it,windowslive.com,live.fr,hotmail.de,hotmail.es,live.co.uk,live.it,hotmail.co.jp,live.com.mx,live.nl,live.de,live.cn,live.ru,live.ca,live.com.ar,hotmail.co.th,live.com.au,live.jp,live.se,live.cl,live.com.pt,live.be,live.dk,hotmail.com.tr,livemail.tw,live.no,hotmail.se,hotmail.com.tw,live.co.kr,hotmail.co.nz,live.at,live.in,hotmail.gr,hotmail.be,live.hk,live.ie,msn.cn,hotmail.co.kr,hotmail.no,hotmail.ch,live.co.za,hotmail.com.hk,live.com.my,live.com.sg,hotmail.fi,hotmail.my,hotmail.co.id,hotmail.sg,hotmail.com.au,hotmail.co.za,hotmail.dk,hotmail.rs,live.com.ph,hotmail.ph,hotmail.com.vn,hotmail.cz,outlook.fr,outlook.com,msn.com,outlook.rollup,outlook-eur.rollup,outlook-apc.rollup,outlook-nam.rollup
    queue-to hotmail.queue

# Yahoo (EU)
domain-macro yahooeu yahoo.dk,yahoo.fr,yahoo.de,yahoo.gr,yahoo.it,yahoo.no,yahoo.pl,yahoo.se,yahoo.co.uk,yahoo.at,yahoo.ro,yahoo.nl,yahoo.es,yahoo.be,yahoo.ie,yahoo-eu.rollup
    queue-to yahooeu.queue

# Yahoo (US/International)
domain-macro yahoo yahoo.com.ar,yahoo.com.au,yahoo.com.br,yahoo.ca,yahoo.cl,yahoo.cn,yahoo.com.co,yahoo.com.mx,yahoo.co.nz,yahoo.com.pe,yahoo.com.tr,rocketmail.com,yahoo.com,ymail.com,y7mail.com,yahoo.com.ve,yahoo.rollup
    queue-to yahoo.queue

# Gmail
domain-macro gmail gmail.com,googlemail.com,gmail-biz.rollup,gmail-forward.rollup
    queue-to gmail.queue

# Proofpoint
domain-macro proofpoint proofpoint.rollup
    queue-to proofpoint.queue

# AOL
domain-macro aol aol.com,aol.fr,aim.com,netscape.net,cs.com,mail.com,wmconnect.com,icqmail.com,email.com,usa.com,aol.com.au,aol.com.mx,aol.com.ar,compuserve.com,yahoo-aol.rollup
    queue-to aol.queue

# Orange
domain-macro orange orange.fr,wanadoo.fr,orange.rollup
    queue-to orange.queue

# Free
domain-macro free free.fr,aliceadsl.fr,tiscali.fr
    queue-to free.queue

# SFR
domain-macro sfr sfr.fr,neuf.fr,cegetel.net,club-internet.fr,sfrbusinessteam.fr,sfr-fr.rollup
    queue-to sfr.queue

# Bouygues
domain-macro bouygues bouygtel.fr,bbox.fr
    queue-to bouygues.queue

# Numericable
domain-macro numericable numericable.fr,noos.fr
    queue-to numericable.queue
