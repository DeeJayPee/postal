############################################################################
# BEGIN: BACKOFF RULES
############################################################################
<smtp-pattern-list blocking-errors>
    # Put queue in backoff mode on throttling/temporary blocks
    reply /421 .* SERVICE NOT AVAILABLE/ mode=backoff
    reply /421 .* Please try again later/ mode=backoff
    reply /Message temporarily deferred/ mode=backoff
    reply /exceeded the rate limit/ mode=backoff
    reply /Connection rate limit exceeded/ mode=backoff

    # Recipient-level hard failures
    reply /OverQuotaTemp/ bounce-rcpt
</smtp-pattern-list>
############################################################################
# END: BACKOFF RULES
############################################################################
