# Domain Macro Configuration for Postal
# Format: domain-macro <name> <domain1>,<domain2>,...,<rollup_name>
#         queue-to <queue_name>

# Orange ISP domains
domain-macro orange orange.fr,wanadoo.fr,orange.rollup
    queue-to orange.queue

# Gmail domains
domain-macro gmail gmail.com,googlemail.com,gmail-biz.rollup
    queue-to gmail.queue

# Yahoo domains
domain-macro yahoo yahoo.com,yahoo.fr,yahoo.co.uk,yahoo.rollup
    queue-to yahoo.queue

# Outlook/Hotmail domains
domain-macro outlook hotmail.com,outlook.com,live.com,outlook-eur.rollup,outlook-nam.rollup,outlook-apc.rollup
    queue-to outlook.queue

# AOL domains
domain-macro aol aol.com,aim.com,yahoo-aol.rollup
    queue-to aol.queue
