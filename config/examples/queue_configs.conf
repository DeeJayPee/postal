# Queue Configuration for Postal
# Format: <domain queue_name>
#           min-smtp-out <number>
#           max-smtp-out <number>
#           max-rcpt-per-message <number>
#         </domain>

# Orange queue configuration
<domain orange.queue>
    min-smtp-out 1
    max-smtp-out 1
    max-rcpt-per-message 100
</domain>

# Gmail queue configuration
<domain gmail.queue>
    min-smtp-out 2
    max-smtp-out 5
    max-rcpt-per-message 100
</domain>

# Yahoo queue configuration
<domain yahoo.queue>
    min-smtp-out 1
    max-smtp-out 3
    max-rcpt-per-message 100
</domain>

# Outlook queue configuration
<domain outlook.queue>
    min-smtp-out 2
    max-smtp-out 4
    max-rcpt-per-message 100
</domain>

# AOL queue configuration
<domain aol.queue>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 50
</domain>

# Proofpoint queue configuration
<domain proofpoint.rollup>
    min-smtp-out 1
    max-smtp-out 3
    max-rcpt-per-message 100
</domain>

# ATT queue configuration
<domain att.rollup>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 100
</domain>

# Yandex queue configuration
<domain yandex.rollup>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 100
</domain>
