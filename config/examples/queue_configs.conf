# Queue Configuration for Postal
# Format: <domain queue_name>
#           min-smtp-out <number>
#           max-smtp-out <number>
#           max-rcpt-per-message <number>
#           max-msg-rate <number>/<d|h|m|s>  # Optional: rate limit (e.g., 10000/d, 2000/h, 100/m, 10/s)
#           backoff-reroute-to <hostname|ip>  # Optional: relay server used only in backoff mode
#           mode <normal|backoff>             # Optional: queue mode
#           backoff-base-delay <number><d|h|m|s>  # Optional: backoff retry base delay (default 2h)
#           backoff-auto-success-threshold <number> # Optional: auto return threshold
#           backoff-auto-success-window <number><d|h|m|s> # Optional: auto return window
#         </domain>

# Orange queue configuration with rate limiting
<domain orange.queue>
    min-smtp-out 1
    max-smtp-out 1
    max-rcpt-per-message 100
    max-msg-rate 2000/h
</domain>

# Gmail queue configuration
<domain gmail.queue>
    min-smtp-out 2
    max-smtp-out 5
    max-rcpt-per-message 100
</domain>

# Yahoo queue configuration
<domain yahoo.queue>
    min-smtp-out 1
    max-smtp-out 3
    max-rcpt-per-message 100
</domain>

# Outlook queue configuration with backoff IP rerouting
<domain outlook.queue>
    min-smtp-out 2
    max-smtp-out 4
    max-rcpt-per-message 100
    mode normal
    backoff-base-delay 2h
    backoff-auto-success-threshold 5
    backoff-auto-success-window 6h
    backoff-reroute-to 192.168.1.100
</domain>

# AOL queue configuration
<domain aol.queue>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 50
</domain>

# Proofpoint queue configuration with both rate limit and backoff IP
<domain proofpoint.rollup>
    min-smtp-out 1
    max-smtp-out 3
    max-rcpt-per-message 100
    max-msg-rate 500/h
    backoff-reroute-to 10.0.0.50
</domain>

# ATT queue configuration
<domain att.rollup>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 100
</domain>

# Yandex queue configuration
<domain yandex.rollup>
    min-smtp-out 1
    max-smtp-out 2
    max-rcpt-per-message 100
</domain>
